<svg xmlns="http://www.w3.org/2000/svg" width="520" height="155" viewBox="0 0 520 155" role="img" aria-labelledby="t d"><title id="t">Avatar generation. Replicate generation pipeline</title><desc id="d">Concept artwork for the repository documentation. Interface details are illustrative and contain no live records.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}.wag{animation:wag 2.5s ease-in-out infinite;transform-origin:204px 120px}@keyframes trace{0%{stroke-dashoffset:160}100%{stroke-dashoffset:0}}.trace{stroke-dasharray:7 9;animation:trace 12s linear infinite}@keyframes halo{0%,100%{opacity:.28}50%{opacity:.8}}.halo{animation:halo 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wag,.trace,.halo{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="150" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(22 24) scale(0.8636363636363636)"><path d="M5 9h34v27H5zM12 25l7-10 8 13 6-7M30 16h1" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="78" y="51" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Avatar generation</text><text x="22" y="115" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Replicate generation pipeline</text></svg>