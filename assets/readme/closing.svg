<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1020" viewBox="0 0 1120 1020" role="img" aria-labelledby="t d"><title id="t">Closer to the collar. Closer to the care. Animated concept dog and veterinarian workspace.</title><desc id="d">Concept artwork for the repository documentation. Interface details are illustrative and contain no live records.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}.wag{animation:wag 2.5s ease-in-out infinite;transform-origin:204px 120px}@keyframes trace{0%{stroke-dashoffset:160}100%{stroke-dashoffset:0}}.trace{stroke-dasharray:7 9;animation:trace 12s linear infinite}@keyframes halo{0%,100%{opacity:.28}50%{opacity:.8}}.halo{animation:halo 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wag,.trace,.halo{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M30 28H1090" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="74" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">PAWSITIVE INNOVATORS / ADIL SUKUMAR</text><text x="32" y="