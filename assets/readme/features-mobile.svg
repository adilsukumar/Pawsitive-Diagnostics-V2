<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1342" viewBox="0 0 640 1342" role="img" aria-labelledby="t d"><title id="t">Pet parent, veterinarian, Sense pages, maps and clinics, reports and community. Concept directory.</title><desc id="d">Concept artwork for the repository documentation. Interface details are illustrative and contain no live records.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}.wag{animation:wag 2.5s ease-in-out infinite;transform-origin:204px 120px}@keyframes trace{0%{stroke-dashoffset:160}100%{stroke-dashoffset:0}}.trace{stroke-dasharray:7 9;animation:trace 12s linear infinite}@keyframes halo{0%,100%{opacity:.28}50%{opacity:.8}}.halo{animation:halo 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wag,.trace,.halo{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="14" width="592" height="204" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-0.0s"><g transform="translate(46 36) scale(0.8636363636363636)"><path d="M14 27c-7 1-11 9-7 13 4 4 11-1 15-1s11 5 15 1c4-4 0-12-7-13-5-6-11-6-16 0zM6 9a4 7 0 1 0 0 14a4 7 0 1 0 0-14M17 2a4 7 0 1 0 0 14a4 7 0 1 0 0-14M29 2a4 7 0 1 0 0 14a4 7 0 1 0 0-14M40 9a4 7 0 1 0 0 14a4 7 0 1 0 0-14" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="65" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Pet parent</text><text x="48" y="123" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Profiles, onboarding, avatars and a</text><text x="48" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">daily care dashboard.</text><rect x="24" y="234" width="592" height="204" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-0.6s"><g transform="translate(46 256) scale(0.8636363636363636)"><path d="M7 41V8h30v33M1 41h42M18 41V30h9v11M17 15h10M22 10v10" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="285" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Veterinarian</text><text x="48" y="343" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Patients, visits, prescriptions, lab,</text><text x="48" y="377" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">billing and inventory views.</text><rect x="24" y="454" width="592" height="204" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-1.2s"><g transform="translate(46 476) scale(0.8636363636363636)"><path d="M5 33l11-24 10 25 13-23M3 41h38" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="505" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Sense pages</text><text x="48" y="563" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Skin, motion, temperature, environment,</text><text x="48" y="597" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">pressure, light and bark.</text><rect x="24" y="674" width="592" height="204" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-1.7999999999999998s"><g transform="translate(46 696) scale(0.8636363636363636)"><path d="M22 3a13 13 0 0 1 13 13c0 10-13 25-13 25S9 26 9 16A13 13 0 0 1 22 3zM22 11a5 5 0 1 0 0 10a5 5 0 1 0 0-10" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="725" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Maps and clinics</text><text x="48" y="783" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Leaflet maps, location trails, nearby</text><text x="48" y="817" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">clinics and directions.</text><rect x="24" y="894" width="592" height="204" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-2.4s"><g transform="translate(46 916) scale(0.8636363636363636)"><path d="M7 3h22l9 10v28H7zM28 3v11h10M13 23h18M13 31h15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="945" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Reports</text><text x="48" y="1003" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">History views, QR presentation and PDF</text><text x="48" y="1037" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">export helpers.</text><rect x="24" y="1114" width="592" height="204" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-3.0s"><g transform="translate(46 1136) scale(0.8636363636363636)"><path d="M4 6h36v25H18L8 40v-9H4zM12 15h20M12 23h12" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="1165" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Community</text><text x="48" y="1223" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Dog-oriented posts, comments and Pet</text><text x="48" y="1257" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Match interfaces.</text></svg>