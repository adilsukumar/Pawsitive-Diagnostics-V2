<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="294" viewBox="0 0 1120 294" role="img" aria-labelledby="t d"><title id="t">USB serial and Bluetooth notifications enter the collar parser and browser history. Demo readings are also present in the source.</title><desc id="d">Concept artwork for the repository documentation. Interface details are illustrative and contain no live records.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}.wag{animation:wag 2.5s ease-in-out infinite;transform-origin:204px 120px}@keyframes trace{0%{stroke-dashoffset:160}100%{stroke-dashoffset:0}}.trace{stroke-dasharray:7 9;animation:trace 12s linear infinite}@keyframes halo{0%,100%{opacity:.28}50%{opacity:.8}}.halo{animation:halo 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wag,.trace,.halo{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="14" width="342" height="260" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-0s"><g transform="translate(46 36) scale(0.8636363636363636)"><path d="M22 42V4m-5 6 5-6 5 6M22 32l-12-9V13M22 26l12-9V9M6 9h8v8H6zM30 3h8v7h-8z" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="46" y="112" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">USB SERIAL</text><text x="46" y="151" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">115200 baud</text><text x="46" y="193" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Newline-delimited</text><text x="46" y="227" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">collar packets.</text><rect x="389" y="14" width="342" height="260" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-1s"><g transform="translate(411 36) scale(0.8636363636363636)"><path d="M21 2l14 12-25 20M21 42l14-12L10 10M21 2v40" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="411" y="112" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">BLUETOOTH</text><text x="411" y="151" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">Nordic UART</text><text x="411" y="193" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">GATT notification</text><text x="411" y="227" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">subscriptions.</text><rect x="754" y="14" width="342" height="260" rx="14" fill="#151420" stroke="#363348"/><g class="halo" style="animation-delay:-2s"><g transform="translate(776 36) scale(0.8636363636363636)"><path d="M7 3h22l9 10v28H7zM28 3v11h10M13 23h18M13 31h15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="776" y="112" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">LOCAL HISTORY</text><text x="776" y="151" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">Browser storage</text><text x="776" y="193" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Readings feed report</text><text x="776" y="227" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">history.</text></svg>